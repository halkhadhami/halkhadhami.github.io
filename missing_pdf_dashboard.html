<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 Missing PDF Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7f9;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            margin-top: 0;
            color: #243447;
        }
        .stats {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: bold;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .toolbar button {
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            background: #2d7ff9;
            color: white;
        }
        .paper-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 10px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .paper-row:hover {
            background: #fafafa;
        }
        .paper-row.downloaded {
            background: #e8f8f5;
            opacity: 0.72;
        }
        .idx {
            width: 36px;
            font-weight: 700;
            color: #7f8c8d;
            padding-top: 3px;
        }
        .info {
            flex: 1 1 auto;
            min-width: 0;
        }
        .title {
            font-weight: 700;
            color: #243447;
            margin-bottom: 4px;
            font-size: 1.02em;
        }
        .meta {
            font-size: 0.88em;
            color: #61717f;
        }
        .note {
            margin-top: 6px;
            font-size: 0.84em;
            color: #9b6b00;
        }
        .badge {
            color: #e67e22;
            font-weight: 700;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            max-width: 360px;
        }
        .btn {
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.88em;
            text-align: center;
            border: none;
            cursor: pointer;
            color: white;
        }
        .btn-pub { background-color: #f39c12; }
        .btn-search { background-color: #34495e; }
        .btn-meta { background-color: #6c5ce7; }
        .btn-copy { background-color: #95a5a6; }
        .copied { background-color: #27ae60 !important; }
        .check-btn {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 3px;
            flex: 0 0 auto;
        }
        .check-btn:checked {
            background-color: #27ae60;
            border-color: #27ae60;
            position: relative;
        }
        .check-btn:checked::after {
            content: '\2713';
            color: white;
            position: absolute;
            top: -2px;
            left: 3px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>S3 Missing PDF Dashboard</h1>
</div>
<script>
    const STORAGE_KEY = 'pmecb_missing_pdf_dashboard_v1';
    const rows = [...document.querySelectorAll('.paper-row')];

    function loadState() {
        const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        rows.forEach((row, index) => {
            const idx = index + 1;
            const checked = !!state[row.dataset.doi];
            const checkbox = document.getElementById('check-' + idx);
            checkbox.checked = checked;
            row.classList.toggle('downloaded', checked);
        });
    }

    function persistRow(idx, checked) {
        const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const row = document.getElementById('row-' + idx);
        state[row.dataset.doi] = checked;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function toggleRow(idx) {
        const row = document.getElementById('row-' + idx);
        const checkbox = document.getElementById('check-' + idx);
        row.classList.toggle('downloaded', checkbox.checked);
        persistRow(idx, checkbox.checked);
    }

    function copyName(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const oldText = btn.innerText;
            btn.innerText = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = oldText;
                btn.classList.remove('copied');
            }, 1500);
        });
    }

    function getUncheckedRows() {
        return rows.filter((row, index) => !document.getElementById('check-' + (index + 1)).checked);
    }

    function openBatch(kind, count) {
        const unchecked = getUncheckedRows().slice(0, count);
        unchecked.forEach((row) => {
            const selector = kind === 'scholar' ? '.btn-search' : '.btn-pub';
            const link = row.querySelector(selector);
            if (link) {
                window.open(link.href, '_blank');
            }
        });
    }

    function resetProgress() {
        localStorage.removeItem(STORAGE_KEY);
        loadState();
    }

    loadState();
</script>
</body>
</html>
